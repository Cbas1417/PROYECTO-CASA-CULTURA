<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Restablecer contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .eye {
      cursor: pointer;
      user-select: none;
    }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3 text-center">Restablecer contraseña</h1>

            <div id="alert" class="alert d-none" role="alert"></div>

            <form id="form-reset">
              <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <div class="input-group">
                  <input type="password" id="pass1" class="form-control" minlength="6" required />
                  <span class="input-group-text eye" id="toggle1">👁️</span>
                </div>
                <div class="form-text">Mínimo 6 caracteres.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <div class="input-group">
                  <input type="password" id="pass2" class="form-control" minlength="6" required />
                  <span class="input-group-text eye" id="toggle2">👁️</span>
                </div>
              </div>

              <button id="btn-guardar" class="btn btn-success w-100" type="submit">
                Guardar contraseña
              </button>
            </form>

            <div class="mt-3 text-center">
              <a href="../login.html">Ir al login</a>
            </div>

            <small class="text-muted d-block mt-2" id="token-preview"></small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Config -->
  <script src="config.js"></script>

  <script>
    const form = document.getElementById("form-reset");
    const alertBox = document.getElementById("alert");

    function showAlert(message, type = "danger") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove("d-none");
    }

    function hideAlert() {
      alertBox.classList.add("d-none");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert();

      const p1 = document.getElementById('pass1').value.trim();
      const p2 = document.getElementById('pass2').value.trim();

      if (p1.length < 6) {
        return showAlert('La contraseña debe tener al menos 6 caracteres', 'warning');
      }
      if (p1 !== p2) {
        return showAlert('Las contraseñas no coinciden', 'warning');
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");  // token desde la URL

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/seguridad/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: p1 })
        });

        const data = await response.json();

        if (data.estado === "ok") {
          alert(data.mensaje);
          window.location.href = "iniciar.html"; 
        } else {
          showAlert(data.mensaje || "Error al restablecer la contraseña");
        }
      } catch (error) {
        showAlert("Error de conexión. Intenta nuevamente.");
      }
    });

    // Opcional: funcionalidad para mostrar/ocultar contraseña
    document.getElementById("toggle1").addEventListener("click", () => {
      const input = document.getElementById("pass1");
      input.type = input.type === "password" ? "text" : "password";
    });
    document.getElementById("toggle2").addEventListener("click", () => {
      const input = document.getElementById("pass2");
      input.type = input.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
