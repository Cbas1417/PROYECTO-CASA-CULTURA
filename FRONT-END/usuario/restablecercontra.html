<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Restablecer contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="recuperar.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    .eye { cursor: pointer; user-select: none; }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="top-bar">
    <nav id="social-icons">
      <figure class="icono">
        <a href="https://www.facebook.com/culturadecaldas/?locale=es_LA" target="_blank" rel="noopener">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook" class="icon" />
        </a>
      </figure>
      <figure class="icono">
        <a href="https://www.instagram.com/caldascultura/" target="_blank" rel="noopener">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" class="icon" />
        </a>
      </figure>
      <figure class="icono">
        <a href="https://twitter.com/culturacaldas" target="_blank" rel="noopener">
          <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="Twitter/X" class="icon" />
        </a>
      </figure>
    </nav>
  </header>

  <!-- Botón volver -->
  <a href="iniciar.html" class="volver" aria-label="Volver">
    <i class="fas fa-arrow-left"></i>
  </a>

  <!-- Main -->
  <main class="container">
    <form id="form-reset" class="carta">
      <h1>Restablecer contraseña</h1>

      <div id="alert" class="alert d-none" role="alert"></div>

      <label for="pass1">Nueva contraseña</label>
      <div class="input-group mb-3">
        <input type="password" id="pass1" minlength="6" required />
        <span class="input-group-text eye" id="toggle1">👁️</span>
      </div>
      <small class="form-text d-block mb-3">Mínimo 6 caracteres.</small>

      <label for="pass2">Confirmar contraseña</label>
      <div class="input-group mb-3">
        <input type="password" id="pass2" minlength="6" required />
        <span class="input-group-text eye" id="toggle2">👁️</span>
      </div>

      <button id="btn-guardar" class="btn-primary" type="submit">Guardar contraseña</button>

      <div class="mt-3">
        <a href="../login.html">Ir al login</a>
      </div>
      <small class="text-muted d-block mt-2" id="token-preview"></small>
    </form>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <div id="footer-container">
      <div id="footer-logo">
        <img src="../imagenes/logo2.png" alt="Logo Casa de la Cultura" />
      </div>
      <div id="footer-divider"></div>
      <div id="footer-info">
        <p><strong>Instagram:</strong> @caldascultura</p>
        <p><strong>Facebook:</strong> Casa de la Cultura Caldas Antioquia</p>
        <p><strong>X:</strong> @culturacaldas</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script>
    const form = document.getElementById("form-reset");
    const alertBox = document.getElementById("alert");

    function showAlert(message, type = "danger") {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.classList.remove("d-none");
    }

    function hideAlert() {
      alertBox.classList.add("d-none");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert();

      const p1 = document.getElementById('pass1').value.trim();
      const p2 = document.getElementById('pass2').value.trim();

      if (p1.length < 6) {
        return showAlert('La contraseña debe tener al menos 6 caracteres', 'warning');
      }
      if (p1 !== p2) {
        return showAlert('Las contraseñas no coinciden', 'warning');
      }

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      try {
        const response = await fetch(`http://127.0.0.1:8000/api/v1/seguridad/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: p1 })
        });

        const data = await response.json();

        if (data.estado === "ok") {
          alert(data.mensaje);
          window.location.href = "iniciar.html"; 
        } else {
          showAlert(data.mensaje || "Error al restablecer la contraseña");
        }
      } catch (error) {
        showAlert("Error de conexión. Intenta nuevamente.");
      }
    });

    // Toggle mostrar/ocultar contraseñas
    document.getElementById("toggle1").addEventListener("click", () => {
      const input = document.getElementById("pass1");
      input.type = input.type === "password" ? "text" : "password";
    });
    document.getElementById("toggle2").addEventListener("click", () => {
      const input = document.getElementById("pass2");
      input.type = input.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
