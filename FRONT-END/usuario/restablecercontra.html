    const form = document.getElementById("reset-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");  // token desde la URL
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('password_confirm').value;

        if (p1.length < 6) return showAlert('La contraseña debe tener al menos 6 caracteres', 'warning');
        if (p1 !== p2) return showAlert('Las contraseñas no coinciden', 'warning');

        const response = await fetch(`http://127.0.0.1:8000/api/v1/seguridad/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });

        const data = await response.json();
        alert(data.mensaje);
        if (data.estado === "ok") {
          window.location.href = "iniciar.html"; // redirige donde quieras
        }
      });
