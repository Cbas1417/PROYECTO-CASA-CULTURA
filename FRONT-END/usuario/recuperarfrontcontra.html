<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recuperar contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3 text-center">Recuperar contraseña</h1>
            <p class="text-muted small">
              Ingresa tu correo. Si existe una cuenta asociada, te enviaremos un enlace para restablecer la contraseña.
            </p>

            <div id="alert" class="alert d-none" role="alert"></div>

            <form id="form-recuperar">
              <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" id="correo" class="form-control" placeholder="tucorreo@dominio.com" required />
              </div>
              <button id="btn-enviar" class="btn btn-primary w-100" type="submit">
                Enviar enlace
              </button>
            </form>

            <div class="mt-3 text-center">
              <a href="../login.html">Volver al login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Config -->
  <script src="config.js"></script>

  <script>
    const form = document.getElementById('form-recuperar');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('btn-enviar');

    function showAlert(msg, type = 'info') {
      alertBox.className = 'alert alert-' + type;
      alertBox.textContent = msg;
      alertBox.classList.remove('d-none');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const correo = document.getElementById('correo').value.trim();
      if (!correo) {
        showAlert('Ingresa un correo válido', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res = await axios.post(window.APP_CONFIG.BASE_API + 'seguridadfront/recuperar', { correo });

        showAlert(res.data.mensaje || 'Si el correo existe, te enviaremos un enlace', 'success');
        form.reset();
      } catch (err) {
        if (err.response) {
          showAlert(err.response.data.mensaje || 'No se pudo enviar el correo', 'danger');
        } else {
          showAlert('Error de red. Intenta de nuevo.', 'danger');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar enlace';
      }
    });
  </script>
</body>
</html>
