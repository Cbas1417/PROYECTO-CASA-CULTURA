<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recuperar contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="recuperar.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<!-- Header con iconos -->
<header class="top-bar">
  <nav id="social-icons">
    <figure class="icono">
      <a href="https://www.facebook.com/culturadecaldas/?locale=es_LA" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook" class="icon" />
      </a>
    </figure>
    <figure class="icono">
      <a href="https://www.instagram.com/caldascultura/" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" class="icon" />
      </a>
    </figure>
    <figure class="icono">
      <a href="https://twitter.com/culturacaldas" target="_blank" rel="noopener">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="Twitter/X" class="icon" />
      </a>
    </figure>
  </nav>
</header>

<!-- Botón de volver -->
<a href="iniciar.html" class="volver" aria-label="Volver">
  <i class="fas fa-arrow-left"></i>
</a>

<body>
  <main class="container">
    <form id="form-recuperar" class="carta">
      <h1>Recuperar contraseña</h1>
      <p class="text-muted small mb-3">
        Ingresa tu correo. Si existe una cuenta asociada, te enviaremos un enlace para restablecer la contraseña.
      </p>

      <div id="alert" class="alert d-none" role="alert"></div>

      <label for="correo">Correo</label>
      <input type="email" id="correo" placeholder="tucorreo@dominio.com" required />

      <button id="btn-enviar" class="btn-primary" type="submit">
        Enviar enlace
      </button>

      <div class="mt-3">
        <a href="../login.html">Volver al login</a>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <div id="footer-container">
      <div id="footer-logo">
        <img src="../imagenes/logo2.png" alt="Logo Casa de la Cultura" />
      </div>
      <div id="footer-divider"></div>
      <div id="footer-info">
        <p><strong>Instagram:</strong> @caldascultura</p>
        <p><strong>Facebook:</strong> Casa de la Cultura Caldas Antioquia</p>
        <p><strong>X:</strong> @culturacaldas</p>
      </div>
    </div>
  </footer>

  <!-- Config -->
  <script src="config.js"></script>
  <script>
    const form = document.getElementById('form-recuperar');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('btn-enviar');

    function showAlert(msg, type = 'info') {
      alertBox.className = 'alert alert-' + type;
      alertBox.textContent = msg;
      alertBox.classList.remove('d-none');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const correo = document.getElementById('correo').value.trim();
      if (!correo) {
        showAlert('Ingresa un correo válido', 'warning');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const res = await axios.post(window.APP_CONFIG.BASE_API + 'seguridadfront/recuperar', { correo });
        showAlert(res.data.mensaje || 'Si el correo existe, te enviaremos un enlace', 'success');
        form.reset();
      } catch (err) {
        if (err.response) {
          showAlert(err.response.data.mensaje || 'No se pudo enviar el correo', 'danger');
        } else {
          showAlert('Error de red. Intenta de nuevo.', 'danger');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar enlace';
      }
    });
  </script>
</body>
</html>
