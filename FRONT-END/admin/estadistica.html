        <div class="form-container">
  <h2>Agregar Nueva Obra</h2>
  <form id="obraForm">
    <div class="form-group">
      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" required>
    </div>

    <div class="form-group">
      <label for="autor">Autor</label>
      <input type="text" id="autor" name="autor" required>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" required></textarea>
    </div>

    <div class="form-group">
      <label for="imagen">Imagen</label>
      <input type="file" id="imagen" name="imagen" accept="image/*" required>
    </div>

    <div class="form-group">
      <label for="video">Enlace a video</label>
      <input type="url" id="video" name="video" placeholder="https://...">
    </div>

    <button type="submit">Guardar Obra</button>
  </form>
</div>

  <!-- Buscador -->
  <input type="text" id="buscarExposicion" placeholder="Buscar por título...">

  <!-- Tabla -->
  <h2>Lista de Exposiciones</h2>
  <table border="1" id="tablaExposiciones">
    <thead>
      <tr>
        <th>Imagen</th>
        <th>Título</th>
        <th>Autor</th>
        <th>Descripción</th>
        <th>Video</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="exposicionesTableBody"></tbody>
  </table>
