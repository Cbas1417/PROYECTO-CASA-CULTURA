  </nav>
  
  <div class="perfil-dropdown" id="perfil-icono" style="display: none;">
    <img id="perfil-img" src="../imagenes/perfill.png" alt="Usuario">
        <div id="dropdown-menu" class="hidden">
            <a href="verperfilad.html">Ver perfil</a>
            <a href="../usuario/iniciar.html" id="cerrar-sesion">Cerrar sesión</a>

<nav id="nav">

  <button id="menu-toggle" aria-label="Abrir menú">&#9776;</button>
  <div id="menu">
    <ul>
      <li><a href="dashboard.html" class="header-button">Administrador</a></li>

    </ul>
  </div>
</nav>

<main class="contenido">
  <div class="panel-usuarios">
    <div class="panel-header">
      <h2>Usuarios Registrados</h2>
      <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="buscador" placeholder="Buscar por nombre o documento...">
      </div>
    </div>
    
    <div class="tabla-container">
      <table class="tabla-usuarios" id="tabla-usuarios">
        <!-- La tabla se llenará con JavaScript -->
      </table>
    </div>
  </div>

  <div class="panel-agregar">
    <h3>Añadir Usuario</h3>
    <form id="form-usuario">
      <select id="tipo_d" required>
        <option value="">Seleccionar tipo de documento</option>
        <option value="cc">Cédula de ciudadanía</option>
        <option value="ti">Tarjeta de identidad</option>
        <option value="ce">Cédula de extranjería</option>
        <option value="pas">Pasaporte</option>
        <option value="nit">NIT</option>
      </select>
      <input type="text" id="documento" placeholder="Número de documento" required>
      <input type="text" id="nombre" placeholder="Nombre completo" required>
      <input type="date" id="nacimiento" required>
      <input type="email" id="correo" placeholder="Correo electrónico" required>
      <input type="tel" id="telefono" placeholder="Teléfono" required>
      <div class="input-container">
  <input type="password" id="contrasena" placeholder="Contraseña" required>
  <i class="fas fa-eye toggle-password" data-target="contrasena"></i>
</div>

      <button type="submit"><i class="fas fa-user-plus"></i> Guardar Usuario</button>
    </form>
  </div>
</main>

<!-- Modal de eliminación -->
<div id="modal-eliminar" class="modal">
  <div class="modal-content">
    <p id="modal-texto"></p>
    <div class="modal-buttons">
      <button id="btn-confirmar-eliminar"><i class="fas fa-trash"></i> Eliminar</button>
      <button id="btn-cancelar-eliminar"><i class="fas fa-times"></i> Cancelar</button>
    </div>
  </div>
</div>

<footer id="footer">
  <div id="footer-container">

    <div id="footer-info">
      <p><strong>Instagram:</strong> @caldascultura</p>
      <p><strong>Facebook:</strong> Casa de la Cultura Caldas Antioquia</p>
      <p><strong>X:</strong> @culturacaldas</p>
    </div>
  </div>
</footer>

<script src="documentos.js">
</script>
