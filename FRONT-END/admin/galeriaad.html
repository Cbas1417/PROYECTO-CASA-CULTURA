  <h1>Galería de Álbumes</h1>

  <button id="crear-album">➕ Crear álbum</button>

  <div id="albums-container">
    <div id="albums" class="albums"></div>
  </div>

  <!-- Vista de un álbum -->
  <div id="album-view" class="hidden">
    <h2 id="album-title"></h2>
    <input type="file" id="add-photo" multiple accept="image/*">
    <div id="photos" class="photos"></div>
    <button id="volver">⬅ Volver a álbumes</button>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>

      <input type="text" id="modal-input" class="hidden" placeholder="Escribe aquí...">

      <div class="modal-actions">
        <button id="modal-cancel">Cancelar</button>
        <button id="modal-confirm">Aceptar</button>
      </div>
    </div>
  </div>
