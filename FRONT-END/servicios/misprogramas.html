<!-- inscripciones.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Inscripciones | Casa de la Cultura Caldas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #FF9015; color: white; }
        .vacío { text-align: center; padding: 20px; color: #777; }
    </style>
</head>
<body>
    <h1>Mis Inscripciones</h1>
    
    <div id="lista-inscripciones">
        <table>
            <thead>
                <tr>
                    <th>Programa</th>
                    <th>Contacto</th>
                    <th>Fecha de inscripción</th>
                </tr>
            </thead>
            <tbody id="inscripciones-body">
                <!-- Las inscripciones se cargarán aquí con JavaScript -->
            </tbody>
        </table>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inscripciones = JSON.parse(localStorage.getItem('inscripciones')) || [];
            const cuerpoTabla = document.getElementById('inscripciones-body');
            
            if (inscripciones.length === 0) {
                cuerpoTabla.innerHTML = '<tr><td colspan="3" class="vacío">No tienes inscripciones aún</td></tr>';
            } else {
                cuerpoTabla.innerHTML = inscripciones.map(insc => `
                    <tr>
                        <td>${insc.programaNombre}</td>
                        <td>${insc.contacto}</td>
                        <td>${insc.fecha}</td>
                    </tr>
                `).join('');
            }
        });
    </script>
</body>
</html>
