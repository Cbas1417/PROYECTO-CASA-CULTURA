<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Casa de la Cultura Caldas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="galeria.css">
</head>
<body>
    <header id="cabeza">
        <nav id="social-icons">
            <figure class="icono">
                <a href="https://www.facebook.com/culturadecaldas/?locale=es_LA" target="_blank" rel="noopener">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook" class="icon" />
                </a>
            </figure>
            <figure class="icono">
                <a href="https://www.instagram.com/caldascultura/" target="_blank" rel="noopener">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" class="icon" />
                </a>
            </figure>
            <figure class="icono">
                <a href="https://twitter.com/culturacaldas" target="_blank" rel="noopener">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="Twitter/X" class="icon" />
                </a>
            </figure>
        </nav>

        <div class="perfil-dropdown" id="perfil-icono">
            <img id="perfil-img" src="https://ui-avatars.com/api/?name=Usuario&background=FF9015&color=fff" alt="Usuario">
            <div id="dropdown-menu" class="hidden">
                <a href="verperfil.html">Ver perfil</a>
                <a href="inicio.html" id="cerrar-sesion">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <nav id="nav">
        <img id="logo" src="https://via.placeholder.com/150x90/3D4543/FFFFFF?text=Logo" alt="Logo">
        <button id="menu-toggle" aria-label="Abrir menú">&#9776;</button>
        <div id="menu">
            <ul>
                <li><a href="inicio.html" class="header-button">Inicio</a></li>
                <li><a href="programas.html" class="header-button">Programas</a></li>
                <li><a href="galeria.html" class="header-button">Galeria</a></li>
                <li><a href="museo.html" class="header-button">Museo</a></li>
                <li><a href="eventos.html" class="header-button">Eventos</a></li>
                <li><a href="contacto.html" class="header-button">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <main>

        <div id="albums-container">
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando álbumes...</p>
            </div>
            
            <div class="albums" id="albums"></div>
        </div>

        <!-- Vista de un álbum -->
        <div id="album-view" class="hidden">
            <div class="album-view-header">
                <h2 id="album-title"></h2>
                <button id="volver"><i class="fas fa-arrow-left"></i> Volver a galería</button>
            </div>
            <div id="photos" class="photos"></div>
        </div>

        <!-- Modal para imagen ampliada -->
        <div id="image-modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close">&times;</button>
                <img id="modal-image" src="" alt="">
            </div>
        </div>
    </main>

    <footer id="footer">
        <div id="footer-container">
            <div id="footer-logo">
                <img src="https://via.placeholder.com/85x50/FF9015/000000?text=Logo" alt="Logo Casa de la Cultura" />
            </div>
            <div id="footer-divider"></div>
            <div id="footer-info">
                <p><strong>Instagram:</strong> @caldascultura</p>
                <p><strong>Facebook:</strong> Casa de la Cultura Caldas Antioquia</p>
                <p><strong>X:</strong> @culturacaldas</p>
            </div>
        </div>
    </footer>
    <script src="galeria.js"></script>
</body>
</html>
